name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    # nuget.org trusts this workflow only in the environment named in its trusted publishing policy.
    environment: nuget
    # contents: create the release and upload its assets; id-token: the OIDC token nuget.org exchanges for a key.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # V01: provide the signing certificate from the secret (base64-encoded .pfx).
      - name: Provide signing certificate
        shell: bash
        run: |
          if [ -n "${{ secrets.SIGNING_CERT_BASE64 }}" ]; then
            printf '%s' "${{ secrets.SIGNING_CERT_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/signing.pfx"
            echo "REGLET_SIGN_CERT=$RUNNER_TEMP/signing.pfx" >> "$GITHUB_ENV"
          fi

      # V02/V04: check, pack, sign and produce checksums; the upload follows in its own steps.
      - name: Build and check release
        shell: bash
        env:
          REGLET_SIGN_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          REGLET_TIMESTAMPER: ${{ vars.TIMESTAMPER }}
        run: build/release.sh "${GITHUB_REF_NAME#v}"

      # Trusted publishing: no stored key; the temporary key is valid for one hour, so it is fetched
      # only now, after the tests.
      - name: NuGet login
        if: github.server_url == 'https://github.com'
        uses: NuGet/login@v1
        id: login
        with:
          user: m-rehder

      - name: Publish to nuget.org
        if: github.server_url == 'https://github.com'
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          push() {
            dotnet nuget push "$1" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
          # The facade goes last, once nuget.org serves its dependencies: pushed together, the facade was
          # listed first (its file sorts first) and a restore in between failed (1.2.0).
          for package in artifacts/packages/*.nupkg; do
            [ "$(basename "$package")" = "Reglet.$version.nupkg" ] || push "$package"
          done
          deadline=$((SECONDS + 2400))
          for id in reglet.core reglet.fonts reglet.docx reglet.odt reglet.pdf reglet.html; do
            until curl -fsS "https://api.nuget.org/v3-flatcontainer/$id/index.json" | grep -q "\"$version\""; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::warning::$id $version is not listed after 40 minutes; pushing the facade anyway."
                break 2
              fi
              sleep 30
            done
          done
          push "artifacts/packages/Reglet.$version.nupkg"
          for symbols in artifacts/packages/*.snupkg; do
            push "$symbols"
          done

      # V02: the release for the tag with the changelog section and the packed artifacts, on the
      # server the workflow runs on. Packages go to nuget.org only from GitHub.
      - name: Create GitHub release
        if: github.server_url == 'https://github.com'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          build/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "Reglet $version" --notes-file "$RUNNER_TEMP/notes.md" \
            artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/packages/SHA256SUMS

      - name: Create Gitea release
        if: github.server_url != 'https://github.com'
        shell: bash
        env:
          GITEA_API_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: build/gitea-release.sh "${GITHUB_REF_NAME#v}"
