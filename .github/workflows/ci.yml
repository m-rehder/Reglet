name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Runs on GitHub and on a self-hosted Gitea runner (Gitea Actions reads .github/workflows
        # too); the Gitea runner is Linux only, and a job without a matching runner stays queued.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build Reglet.sln --configuration Release

      # veraPDF (Java) validates the PDF/A samples of the compatibility checks; unattended
      # IzPack install, pinned so a new release cannot change the result unnoticed.
      - name: Install veraPDF
        shell: bash
        run: |
          command -v java >/dev/null || { apt-get update -qq && apt-get install -y -qq default-jre-headless; }
          curl -sSLo /tmp/verapdf.zip https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.4-installer.zip
          unzip -q -o /tmp/verapdf.zip -d /tmp/verapdf-installer
          cat > /tmp/verapdf-auto.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>/tmp/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          java -jar /tmp/verapdf-installer/*/verapdf-izpack-installer-*.jar /tmp/verapdf-auto.xml
          /tmp/verapdf/verapdf --version

      - name: Compatibility checks
        env:
          REGLET_VERAPDF: /tmp/verapdf/verapdf
        run: dotnet run --project tests/Reglet.CompatibilityTests --configuration Release

      - name: Zero-Dependency
        shell: bash
        run: build/check-zero-dependency.sh

      - name: Dependency boundaries
        shell: bash
        run: build/check-architecture.sh

      - name: Package zero-dependency
        shell: bash
        run: build/check-package.sh

      - name: Consumer smoke tests
        shell: bash
        run: build/run-smoke.sh

      - name: Examples
        shell: bash
        run: build/run-examples.sh

      - name: API reference up to date
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project tools/ApiReference -- docs/api-reference.md --check

      - name: Native AOT
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: build/run-aot.sh

      # Ubuntu ships Chromium only as a snap (unusable in a container); Playwright's build
      # also exists for linux-arm64 (Pi runner).
      - name: Blazor WebAssembly
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium
          REGLET_CHROME="$(find ~/.cache/ms-playwright -path '*chrome-linux/chrome' -type f | head -1)" build/run-wasm.sh

      - name: AOT safety
        shell: bash
        run: build/check-aot-safety.sh

      # The thresholds in build/benchmarks.txt are measured on the self-hosted runner; GitHub's shared
      # runners vary too much for them.
      - name: Benchmarks
        if: matrix.os == 'ubuntu-latest' && github.server_url != 'https://github.com'
        shell: bash
        run: build/run-benchmarks.sh

      - name: Beta package (package consumption)
        shell: bash
        run: build/check-beta.sh

      - name: Checksums
        shell: bash
        run: build/checksums.sh
